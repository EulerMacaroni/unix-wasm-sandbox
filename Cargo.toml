[package]
name = "unix-wasm-sandbox"
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"
description = "A PyO3-powered Python API for running UNIX-like Wasmer sandboxes."

[lib]
name = "unix_sandbox_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
anyhow = "1.0.95"
base64 = "0.22.1"
pyo3 = "0.28.3"
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["io-util", "rt-multi-thread", "sync", "time"] }
virtual-fs = { git = "https://github.com/EulerMacaroni/wasmer", rev = "f8edb58bfb4599da1f870a8f1a7f395aa043d834" }
wasmer = { git = "https://github.com/EulerMacaroni/wasmer", rev = "f8edb58bfb4599da1f870a8f1a7f395aa043d834", features = ["llvm"] }
wasmer-package = { git = "https://github.com/EulerMacaroni/wasmer", rev = "f8edb58bfb4599da1f870a8f1a7f395aa043d834" }
wasmer-wasix = { git = "https://github.com/EulerMacaroni/wasmer", rev = "f8edb58bfb4599da1f870a8f1a7f395aa043d834" }
wat = "1.240.0"
webc = "=12.0.1"

[dev-dependencies]
tempfile = "3.15.0"
